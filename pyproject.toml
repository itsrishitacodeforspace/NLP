[project]
name = "bharatcontract-ai"
version = "0.1.0"
description = "Legal Contract Intelligence — Indian-context risk-aware clause extraction & obligation tracker"
authors = [{ name = "BharatContract AI Team" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
    # NLP rules (light)
    "spacy>=3.7,<4",
    # Backend
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "python-multipart>=0.0.9,<1",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    # Task queue / cache
    "celery>=5.3,<6",
    "redis>=5.0,<6",
    # Databases
    "neo4j>=5.18,<6",
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.13,<2",
    # Frontend / dashboards
    "streamlit>=1.31,<2",
    "streamlit-agraph>=0.0.45",
    "pyvis>=0.3.2",
    "plotly>=5.18,<6",
    "pandas>=2.0,<3",
    "numpy>=1.26,<2",
    # Document parsing
    "pdfplumber>=0.10,<1",
    "PyMuPDF>=1.23,<2",
    "python-docx>=1.0,<2",
    "pytesseract>=0.3.10",
    "Pillow>=10.0,<12",
    # Utilities
    "httpx>=0.27,<1",
    "requests>=2.31,<3",
    "tenacity>=8.2,<9",
    "python-dateutil>=2.8,<3",
    "PyPDF2>=3.0,<4",
    "python-dotenv>=1.0,<2",
    "loguru>=0.7,<1",
    "scikit-learn>=1.3,<2",
    "py7zr>=1.1.4",
    "joblib>=1.5.3",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.36,<5",
    "torch>=2.1,<3",
    "tokenizers>=0.15,<1",
    "accelerate>=0.25,<1",
    "sentence-transformers>=2.2,<3",
    "unstructured>=0.11,<1",
    "scikit-learn>=1.3,<2",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<5",
    "ruff>=0.3,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=4.1,<5",
    "ruff>=0.3,<1",
    "scikit-learn>=1.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    "provenance: fail-closed provenance / data-lineage checks (see plan.md)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]  # FastAPI dependency markers are function calls by design

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "nlp", "streamlit_app"]
