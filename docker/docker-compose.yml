version: "3.9"

services:
  neo4j:
    image: neo4j:5.18.0
    container_name: bharatcontract_neo4j
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/contractpass
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: bharatcontract_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=bharat
      - POSTGRES_PASSWORD=contractpass
      - POSTGRES_DB=bharatcontract
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bharatcontract_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bharatcontract_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://bharat:contractpass@postgres:5432/bharatcontract
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=contractpass
      - MODEL_CACHE_DIR=/app/models
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      - neo4j
      - postgres
      - redis
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bharatcontract_ui
    command: ["streamlit", "run", "streamlit_app/Home.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=contractpass
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data: